[project]
name = "flow-policy"
version = "0.1.0"
description = "Language-conditioned imitation-learning policy with a flow-matching action head, on PushT."
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.2",
    "gym-pusht>=0.1.5",
    "gymnasium>=0.29",
    "numpy>=1.26,<2.0",
    "open_clip_torch>=2.24",
    "matplotlib>=3.8",
    "imageio[ffmpeg]>=2.34",
    "pygame>=2.5",
    "pymunk>=6.6,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flow_policy"]
